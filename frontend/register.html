<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Pesona Desa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #1a3a2a 0%, #2d6a4f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
    }
    .register-card {
      width: 100%;
      max-width: 460px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .brand-logo {
      color: #2d6a4f;
      font-weight: 700;
      font-size: 1.4rem;
    }
    .role-option input[type="radio"] { display: none; }
    .role-option label {
      cursor: pointer;
      border: 2px solid #dee2e6;
      border-radius: 10px;
      padding: 12px 16px;
      display: block;
      transition: all 0.2s;
    }
    .role-option input[type="radio"]:checked + label {
      border-color: #2d6a4f;
      background-color: #eaf4ef;
      color: #1a3a2a;
    }
  </style>
</head>
<body>

  <div id="toast-container" style="position:fixed; top:16px; right:16px; z-index:9999;"></div>

  <div class="register-card card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="brand-logo mb-1">🏕️ Pesona Desa</div>
      <h5 class="fw-semibold text-muted">Buat Akun Baru</h5>
    </div>

    <form id="register-form" novalidate>
      <!-- Nama -->
      <div class="mb-3">
        <label for="name" class="form-label fw-semibold">Nama Lengkap</label>
        <input type="text" class="form-control" id="name" placeholder="Nama kamu" required />
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control" id="email" placeholder="contoh@email.com" required />
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Minimal 6 karakter" required />
      </div>

      <!-- Pilih Role -->
      <div class="mb-4">
        <label class="form-label fw-semibold">Daftar Sebagai</label>
        <div class="row g-2">
          <div class="col-6 role-option">
            <input type="radio" name="role" id="role-tourist" value="tourist" checked />
            <label for="role-tourist">
              <div class="fw-semibold">🧳 Wisatawan</div>
              <small class="text-muted">Cari & booking destinasi</small>
            </label>
          </div>
          <div class="col-6 role-option">
            <input type="radio" name="role" id="role-provider" value="provider" />
            <label for="role-provider">
              <div class="fw-semibold">🏠 Penyedia Jasa</div>
              <small class="text-muted">Kelola destinasi wisata</small>
            </label>
          </div>
        </div>
        <!-- Note: Admin hanya bisa dibuat manual, tidak bisa register -->
        <small class="text-muted d-block mt-2">
          ⚠️ Akun Admin tidak bisa didaftarkan dari sini.
        </small>
      </div>

      <button type="submit" id="btn-register" class="btn btn-success w-100 fw-semibold">
        Daftar Sekarang
      </button>
    </form>

    <hr class="my-4" />
    <p class="text-center text-muted mb-0">
      Sudah punya akun?
      <a href="login.html" class="text-success fw-semibold">Login di sini</a>
    </p>
    <p class="text-center mt-2 mb-0">
      <a href="index.html" class="text-secondary small">← Kembali ke Beranda</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const role = document.querySelector('input[name="role"]:checked').value;
      const btn = document.getElementById("btn-register");

      if (!name || !email || !password) {
        showToast("Semua field wajib diisi.", "danger");
        return;
      }

      if (password.length < 6) {
        showToast("Password minimal 6 karakter.", "danger");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Mendaftar...";

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password, role }),
        });

        const data = await res.json();

        if (!res.ok) {
          showToast(data.message || "Registrasi gagal.", "danger");
          return;
        }

        showToast(data.message || "Registrasi berhasil! Silakan login.", "success");
        setTimeout(() => (window.location.href = "login.html"), 1200);
      } catch (err) {
        showToast("Tidak bisa konek ke server. Pastikan backend sudah jalan.", "danger");
      } finally {
        btn.disabled = false;
        btn.textContent = "Daftar Sekarang";
      }
    });
  </script>
</body>
</html>
